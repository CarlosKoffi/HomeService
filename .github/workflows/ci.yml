name: Build and tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    name: Compile, unit tests and integration workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore HomeService.sln

      - name: Build
        run: dotnet build HomeService.sln --configuration Release --no-restore

      - name: Unit tests
        env:
          FIREBASE_NOTIFICATIONS_ENABLED: "false"
        run: dotnet test tests/HomeService.Tests.Unit/HomeService.Tests.Unit.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx"

      - name: Order workflow integration test with mocked payments and notifications
        env:
          FIREBASE_NOTIFICATIONS_ENABLED: "false"
          PAYMENT_PROVIDER_MODE: "Mock"
        run: dotnet test tests/HomeService.Tests.Integration/HomeService.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ClientMissionWorkflowIntegrationTests" --logger "trx;LogFileName=order-workflow-tests.trx"

      - name: Admin critical endpoint contract tests
        env:
          FIREBASE_NOTIFICATIONS_ENABLED: "false"
          PAYMENT_PROVIDER_MODE: "Mock"
        run: dotnet test tests/HomeService.Tests.Integration/HomeService.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~AdminEndpointContractTests" --logger "trx;LogFileName=admin-contract-tests.trx"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: warn

      - name: Production smoke tests after deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_API_BASE_URL: ${{ secrets.SMOKE_API_BASE_URL }}
          SMOKE_SITE_AUTH_USERNAME: ${{ secrets.SMOKE_SITE_AUTH_USERNAME }}
          SMOKE_SITE_AUTH_PASSWORD: ${{ secrets.SMOKE_SITE_AUTH_PASSWORD }}
          SMOKE_STARTUP_DELAY_SECONDS: ${{ vars.SMOKE_STARTUP_DELAY_SECONDS || '120' }}
        run: pwsh ./deploy/smoke-test.ps1
