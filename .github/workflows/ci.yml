name: Build and tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: build-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile, unit tests and integration workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore HomeService.Server.slnf

      - name: Build
        run: dotnet build HomeService.Server.slnf --configuration Release --no-restore

      - name: Unit tests
        env:
          FIREBASE_NOTIFICATIONS_ENABLED: "false"
        run: dotnet test tests/HomeService.Tests.Unit/HomeService.Tests.Unit.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --blame-crash --blame-hang-timeout 5m

      - name: Full integration test suite with mocked payments and notifications
        env:
          FIREBASE_NOTIFICATIONS_ENABLED: "false"
          PAYMENT_PROVIDER_MODE: "Mock"
        run: dotnet test tests/HomeService.Tests.Integration/HomeService.Tests.Integration.csproj --configuration Release --no-build --logger "trx;LogFileName=integration-tests.trx" --blame-crash --blame-hang-timeout 5m

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/**/TestResults/*.trx
          if-no-files-found: warn

      - name: Production smoke tests after deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SMOKE_API_BASE_URL: ${{ secrets.SMOKE_API_BASE_URL }}
          SMOKE_SITE_AUTH_USERNAME: ${{ secrets.SMOKE_SITE_AUTH_USERNAME }}
          SMOKE_SITE_AUTH_PASSWORD: ${{ secrets.SMOKE_SITE_AUTH_PASSWORD }}
          SMOKE_STARTUP_DELAY_SECONDS: ${{ vars.SMOKE_STARTUP_DELAY_SECONDS || '120' }}
        run: pwsh ./deploy/smoke-test.ps1

  mobile:
    name: Build installable Android APKs
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Validate Android production secrets on protected branches
        if: github.event_name != 'pull_request'
        id: android-secrets
        shell: pwsh
        run: |
          $required = @(
            'GOOGLE_MAPS_ANDROID_API_KEY',
            'ANDROID_KEYSTORE_BASE64',
            'ANDROID_KEYSTORE_PASSWORD',
            'ANDROID_KEY_ALIAS',
            'ANDROID_KEY_PASSWORD')
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            Write-Warning "Signed production APKs are skipped until these GitHub secrets are configured: $($missing -join ', ')"
            "ready=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          "ready=true" >> $env:GITHUB_OUTPUT

      - name: Install MAUI Android workload
        if: github.event_name == 'pull_request' || steps.android-secrets.outputs.ready == 'true'
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Build client, provider and company APKs
        if: github.event_name == 'pull_request' || steps.android-secrets.outputs.ready == 'true'
        shell: pwsh
        run: ./deploy/build-android-apks.ps1

      - name: Upload installable Android APKs
        if: github.event_name == 'pull_request' || steps.android-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wele-android-apks-${{ github.sha }}
          path: |
            artifacts/android/*.apk
            artifacts/android/build-manifest.json
          if-no-files-found: error
          retention-days: 14
