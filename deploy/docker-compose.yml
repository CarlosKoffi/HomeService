services:
  api:
    build:
      context: ..
      dockerfile: src/HomeService.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      SeedData__DemoMissionsEnabled: ${SEED_DEMO_MISSIONS:-false}
      STORAGE_ROOT_PATH: /app/storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-Local}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_PUBLIC_BUCKET: ${R2_PUBLIC_BUCKET:-wele-public-media-prod}
      R2_PRIVATE_BUCKET: ${R2_PRIVATE_BUCKET:-wele-private-media-prod}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      R2_PUBLIC_ASSET_VERSION: ${R2_PUBLIC_ASSET_VERSION:-20260807-optimized-1}
      R2_PUBLIC_DIRECT_DELIVERY_ENABLED: ${R2_PUBLIC_DIRECT_DELIVERY_ENABLED:-false}
      R2_SEED_PUBLIC_ASSETS_ON_STARTUP: ${R2_SEED_PUBLIC_ASSETS_ON_STARTUP:-true}
      R2_SYNC_PUBLIC_ASSETS_ON_STARTUP: ${R2_SYNC_PUBLIC_ASSETS_ON_STARTUP:-true}
      R2_MIGRATE_LOCAL_ASSETS_ON_STARTUP: ${R2_MIGRATE_LOCAL_ASSETS_ON_STARTUP:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - postgres
    volumes:
      - api-storage:/app/storage
    restart: unless-stopped

  company:
    build:
      context: ..
      dockerfile: src/HomeService.Company/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: ${API_BASE_URL:-http://api:8080}
    ports:
      - "${COMPANY_PORT:-8081}:8080"
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: src/HomeService.Admin/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ApiBaseUrl: ${API_BASE_URL:-http://api:8080}
    ports:
      - "${ADMIN_PORT:-8082}:8080"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
  api-storage:
